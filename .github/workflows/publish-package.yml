name: Publish to GitHub Packages

on:
  release:
    types: [created, published]
  workflow_dispatch:

jobs:
  publish-gpr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@h0tnanny'

      - name: Update package name for GitHub Packages
        run: |
          node -e "const pkg=require('./package.json'); pkg.name='@h0tnanny/openspec-ex'; pkg.publishConfig={registry:'https://npm.pkg.github.com'}; require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2));"

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
