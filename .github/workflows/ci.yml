name: CI, Build & Package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Test on ${{ matrix.os }} (Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        run: npm install

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Run Vitest Suite & Snapshots
        run: npm test

      - name: Build Distributable Packages
        run: npm run build

      - name: Test Compiled CLI & Dry Run Pack
        run: |
          node dist/bin/cli.cjs init --agent antigravity
          npm pack --dry-run

  build-package:
    name: Build & Upload Package Artifact
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install Dependencies & Build
        run: |
          npm install
          npm run build

      - name: Pack NPM Tarball
        id: pack
        run: |
          TARBALL=$(npm pack)
          echo "tarball_name=$TARBALL" >> $GITHUB_OUTPUT
          echo "Packaged tarball: $TARBALL"

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.tarball_name }}
          path: ${{ steps.pack.outputs.tarball_name }}
          retention-days: 30

  publish-github-packages:
    name: Publish to GitHub Packages
    needs: build-package
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@h0tnanny'

      - name: Install Dependencies & Build
        run: |
          npm install
          npm run build

      - name: Prepare GitHub Packages Manifest
        run: |
          node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('./package.json','utf8')); pkg.name='@h0tnanny/openspec-ex'; pkg.publishConfig={registry:'https://npm.pkg.github.com'}; fs.writeFileSync('./package.json', JSON.stringify(pkg, null, 2));"

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish to NPM Registry
    needs: build-package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies & Build
        run: |
          npm install
          npm run build

      - name: Publish to NPM
        if: env.NPM_TOKEN != ''
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: Create GitHub Release
    needs: [build-package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install Dependencies & Build
        run: |
          npm install
          npm run build

      - name: Pack NPM Tarball
        id: pack
        run: |
          TARBALL=$(npm pack)
          echo "tarball_name=$TARBALL" >> $GITHUB_OUTPUT

      - name: Create GitHub Release & Attach Tarball
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pack.outputs.tarball_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
